name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject commits that are not nvmaditya
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ALLOWED='138802256+nvmaditya@users.noreply.github.com'
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}..${SHA}"
          else
            RANGE="HEAD"
          fi
          bad=0
          while IFS= read -r line; do
            email="${line%% *}"
            sha="${line##* }"
            if [ "$email" != "$ALLOWED" ]; then
              echo "::error::commit ${sha} uses ${email}, want ${ALLOWED}"
              bad=1
            fi
          done < <(git log ${RANGE} --format='%ae %H%n%ce %H')
          exit "$bad"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK=/tmp/gh-pages-deploy
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -a out/. "$WORK/"
          cd "$WORK"
          git init -b gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
